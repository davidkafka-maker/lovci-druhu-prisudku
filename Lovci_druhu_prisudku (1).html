<style>
:root{--bg:#140807;--gold:#ffd36a;--text:#fff7df;--muted:#e8cfaa;--ok:#78f0a0;--bad:#ff6262}
*{box-sizing:border-box}html,body{min-height:100%;margin:0}body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:radial-gradient(circle at top,#542014 0,#160806 48%,#050101 100%);color:var(--text)}

.choiceGrid{display:grid;grid-template-columns:repeat(2,minmax(120px,1fr));gap:18px;margin:22px auto 8px;max-width:640px}.choiceBtn{border:3px solid #ffd36a88;border-radius:18px;padding:16px;background:linear-gradient(#fff8e8,#f5dba7);color:#1a0804;font-size:clamp(22px,3.5vw,34px);font-weight:1000;text-align:center;cursor:pointer;box-shadow:0 7px 0 #8d4d14;transition:transform .08s,filter .08s,border-color .08s}.choiceBtn:hover{filter:brightness(1.08)}.choiceBtn:active{transform:translateY(4px);box-shadow:0 3px 0 #8d4d14}.choiceBtn:disabled{cursor:default;opacity:.72}.choiceBtn.correct{border-color:var(--ok);background:#dfffea;box-shadow:0 7px 0 #187d45;opacity:1}.choiceBtn.wrong{border-color:var(--bad);background:#ffe1e1;box-shadow:0 7px 0 #8f2020;opacity:1}

.choiceGrid{grid-template-columns:repeat(3,minmax(0,1fr));max-width:900px;gap:10px}.choiceBtn{font-size:clamp(16px,2.5vw,23px);padding:13px 8px}

<script>
"use strict";
const SHEET_ID="1pkj1ISkzdtgNphGLGwakezT1WzHJxz-pv2OLnCmfnLk";
const GAS_WEB_APP_URL="https://script.google.com/macros/s/AKfycbzrwi1N_f2ddRf2XsOLBtDEFmcxAdWPpW170_dtGNSXUl8vejZl1dhxkqMYhjdxVs8u/exec";
const RESULTS_SHEET_URL="https://docs.google.com/spreadsheets/d/1pkj1ISkzdtgNphGLGwakezT1WzHJxz-pv2OLnCmfnLk/edit?usp=sharing";
const TIME_LIMIT=30,TEST_COUNT=20,CHALLENGE_TARGET=20,app=document.getElementById("app");
const TYPES=["Slovesný jednoduchý","Slovesný složený","Jmenný se sponou"];
const DATA=JSON.parse(document.getElementById("bank").textContent);
let state={screen:"home",mode:null,name:"",clazz:"",pool:[],index:0,score:0,correct:0,wrongCount:0,streak:0,timer:null,pending:null,locked:false,restart:false,finishSent:false,seenChallenge:new Set()};
const CHEAT_NOTICE_KEY="lovciDruhuPrisudku_cheatNotice";
function clearCheatNotice(){try{sessionStorage.removeItem(CHEAT_NOTICE_KEY)}catch(e){}}
function activeProtected(){return ["challenge","test"].includes(state.mode)&&state.screen==="question"&&!state.finishSent}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function clearTimer(){clearInterval(state.timer);state.timer=null}function clearPending(){clearTimeout(state.pending);state.pending=null}
function render(html,mode=state.mode){document.body.className=mode?"mode-"+mode:"";app.innerHTML=html;document.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>actions[b.dataset.act]())}
function home(){if(activeProtected()){cheatFinish("kliknutí na HLAVNÍ MENU");return}if(state.cheated)clearCheatNotice();clearTimer();clearPending();state.screen="home";state.mode=null;render('<div class="card"><h1 class="title">Lovci druhů přísudku</h1><p class="subtitle">Označ slova přísudku, vyber jeho druh a potvrď tlačítkem HOTOVO.<br><strong>'+DATA.length+' úloh • VÝZVA a TEST: 30 sekund • TRÉNINK: bez času</strong></p><div class="row"><button class="btn challengeBtn" data-act="nameChallenge">VÝZVA</button><button class="btn testBtn" data-act="nameTest">TEST</button><button class="btn ghost" data-act="training">TRÉNINK</button></div><div class="row"><a class="btn ghost" href="'+RESULTS_SHEET_URL+'" target="_blank" rel="noopener noreferrer" style="text-decoration:none">VÝSLEDKOVÁ TABULKA</a></div><p class="small">TEST: 20 náhodných úloh, každá za 1 bod.<br>VÝZVA: 20 správných odpovědí v řadě = jednička. Chyba nebo vypršení času začíná novou sérii.<br>TRÉNINK: bez času a známkování, se zpětnou vazbou po každé odpovědi.<br>Označ všechna slova přísudku včetně pomocných sloves a zvratných částic se/si (také ses/sis).<br>U jmenného přísudku označ sponu a základ jmenné části, bez jejích přívlastků a dalších rozvíjejících výrazů.<br>Například: Je zkušeným lékařem. → je + lékařem.<br>Výběr můžeš změnit opětovným kliknutím. HOTOVO potvrdí slova i druh současně.<br>Ve VÝZVĚ a TESTU opuštění stránky nebo návrat do menu během pokusu jej ukončí známkou 6. Posouvání a přibližování obrazu nevadí.</p><table class="resultTable"><tr><th>Body v testu</th><th>Známka</th></tr><tr><td>20–18</td><td>1</td></tr><tr><td>17–16</td><td>2</td></tr><tr><td>15–14</td><td>3</td></tr><tr><td>13–12</td><td>4</td></tr><tr><td>11–0</td><td>5</td></tr></table></div>',null)}
function nameScreen(mode){clearPending();state.mode=mode;state.screen="name";render('<div class="card"><h1 class="title">'+(mode==="challenge"?"VÝZVA":"TEST")+'</h1><div class="nameBox"><input class="input" id="name" autocomplete="name" placeholder="Jméno žáka" aria-label="Jméno žáka"><input class="input" id="clazz" placeholder="Třída" aria-label="Třída"><button class="btn '+(mode==="challenge"?"challengeBtn":"testBtn")+'" id="start">ZAČÍT</button>'+(mode==="challenge"?'<button class="btn ghost" data-act="home">HLAVNÍ MENU</button>':'')+'</div></div>');document.getElementById("start").onclick=()=>{const n=document.getElementById("name").value.trim(),c=document.getElementById("clazz").value.trim();if(!n||!c){alert("Vyplň jméno i třídu.");return}state.name=n;state.clazz=c;start(mode)}}
function start(mode){clearCheatNotice();clearTimer();clearPending();state={...state,screen:"question",mode,pool:mode==="test"?shuffle(DATA).slice(0,TEST_COUNT):shuffle(DATA),index:0,score:0,correct:0,wrongCount:0,streak:0,locked:false,restart:false,finishSent:false,cheated:false,cheatSoundPending:false,seenChallenge:new Set()};next()}
function next(){clearTimer();clearPending();if(state.mode==="test"&&state.index>=TEST_COUNT)return finish();if(state.mode!=="test"&&state.index>=state.pool.length){state.seenChallenge.clear();state.pool=shuffle(DATA);state.index=0}state.screen="question";state.current=state.pool[state.index];if(state.mode==="challenge")state.seenChallenge.add(state.current.id);state.locked=false;renderQuestion();if(state.mode!=="training")startTimer()}
function renderQuestion(){
 const q=state.current;state.selected=new Set();state.selectedType=null;
 render('<div class="card"><div class="topbar"><div class="seal '+(state.mode==="challenge"?"challengeSeal":"testSeal")+'">'+(state.mode==="training"?"TRÉNINK":state.mode==="challenge"?"VÝZVA":"TEST")+'</div><div class="timeCenter"><span id="time">'+(state.mode==="training"?"∞":TIME_LIMIT)+'</span><span class="status">ÚLOHA '+(state.index+1)+(state.mode==="test"?"/"+TEST_COUNT+" • BODY "+state.score:state.mode==="training"?" • BEZ ČASU":" • SÉRIE "+state.streak+"/"+CHALLENGE_TARGET)+'</span></div><div class="seal sectionSeal">DRUHY<br>PŘÍSUDKU</div></div><div class="prompt">Označ přísudek a vyber jeho druh.</div><div class="question" aria-label="Věta: označ slova přísudku">'+q.words.map((w,i)=>'<button type="button" class="wordBtn" data-word="'+i+'" aria-pressed="false">'+esc(w)+'</button>').join(' ')+'</div><p class="small">Označ všechny části přísudku. U jmenného přísudku sponu a základ jmenné části bez rozvíjejících výrazů.</p><div class="choiceGrid">'+TYPES.map((t,i)=>'<button type="button" class="choiceBtn" data-type="'+i+'" aria-pressed="false">'+esc(t)+'</button>').join('')+'</div><div class="row"><button class="btn" id="done" disabled>HOTOVO</button></div><div class="feedback" id="fb" aria-live="polite"></div><div class="row" id="nextRow"></div>'+(state.mode!=="test"?'<div class="row"><button class="btn ghost" data-act="home">HLAVNÍ MENU</button></div>':'')+'</div>');
 document.querySelectorAll('[data-word]').forEach(b=>b.onclick=()=>{if(state.locked)return;const i=Number(b.dataset.word);if(state.selected.has(i))state.selected.delete(i);else state.selected.add(i);b.classList.toggle('selected',state.selected.has(i));b.setAttribute('aria-pressed',String(state.selected.has(i)));updateDone()});
 document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{if(state.locked)return;state.selectedType=Number(b.dataset.type);document.querySelectorAll('[data-type]').forEach(x=>{const chosen=Number(x.dataset.type)===state.selectedType;x.classList.toggle('selected',chosen);x.setAttribute('aria-pressed',String(chosen))});updateDone()});
 document.getElementById('done').onclick=answer;
}
function updateDone(){document.getElementById('done').disabled=state.locked||state.selected.size===0||state.selectedType===null}
function correctSentence(q){return q.words.map((w,i)=>q.expected.includes(i)?'<span class="correctText">'+esc(w)+'</span>':esc(w)).join(' ')}
function markChoices(){const q=state.current;document.querySelectorAll('[data-word]').forEach(b=>{const i=Number(b.dataset.word);b.disabled=true;if(q.expected.includes(i))b.classList.add('correct');else if(state.selected.has(i))b.classList.add('wrong')});document.querySelectorAll('[data-type]').forEach(b=>{const i=Number(b.dataset.type);b.disabled=true;if(i===q.type)b.classList.add('correct');else if(i===state.selectedType)b.classList.add('wrong')});document.getElementById('done').disabled=true}
function answer(){if(state.locked||state.screen!=="question"||state.selectedType===null||!state.selected.size)return;const q=state.current;const good=state.selectedType===q.type&&state.selected.size===q.expected.length&&q.expected.every(i=>state.selected.has(i));finishAnswer(good,null,false)}
function timeout(){if(!state.locked&&state.screen==="question")finishAnswer(false,null,true)}
function finishAnswer(good,button,expired){state.locked=true;clearTimer();markChoices();const q=state.current,fb=document.getElementById("fb");if(good){state.correct++;state.score++;state.streak++;fb.innerHTML='<span class="ok">SPRÁVNĚ!'+(state.mode==="test"?" +1 BOD":"")+'</span>';soundCorrect()}else{state.wrongCount++;state.streak=0;state.restart=state.mode==="challenge";fb.innerHTML='<span class="bad">'+(expired?"ČAS VYPRŠEL":"CHYBA")+(state.restart?" — VÝZVA ZAČÍNÁ ZNOVU":"")+'</span><br><span class="small">Správně: '+correctSentence(q)+'<br>Druh: '+esc(TYPES[q.type])+'</span>';soundWrong()}if(state.mode==="training")fb.innerHTML+='<br><span class="small">'+(good?'Přísudek: '+correctSentence(q)+'<br>Druh: '+esc(TYPES[q.type])+'<br>':'')+['Jde o tvar jednoho slovesa, i když obsahuje více slov.','Způsobové nebo fázové sloveso je spojeno s infinitivem plnovýznamového slovesa.','Spona spojuje podmět se jmennou částí, která mu přisuzuje vlastnost nebo jej zařazuje.'][q.type]+'</span>';state.index++;if(state.mode==="challenge"&&good&&state.streak>=CHALLENGE_TARGET){state.pending=setTimeout(finishChallenge,800);return}document.getElementById("nextRow").innerHTML='<button class="btn ghost" data-act="next">'+(state.restart?"NOVÁ VÝZVA":state.mode==="test"&&state.index===TEST_COUNT?"VÝSLEDEK":"DALŠÍ")+'</button>';document.querySelector('[data-act="next"]').onclick=advance;if(state.mode!=="training")state.pending=setTimeout(advance,good?850:4500)}
function advance(){if(!state.locked||state.screen!=="question")return;clearPending();if(state.restart){let remaining=DATA.filter(q=>!state.seenChallenge.has(q.id));if(remaining.length<CHALLENGE_TARGET){state.seenChallenge.clear();remaining=DATA}state.pool=shuffle(remaining);state.index=0;state.score=0;state.correct=0;state.wrongCount=0;state.streak=0;state.restart=false}next()}
function startTimer(){state.deadline=Date.now()+TIME_LIMIT*1000;updateTime();state.timer=setInterval(()=>{updateTime();if(Date.now()>=state.deadline){clearTimer();timeout()}},100)}
function updateTime(){const e=document.getElementById("time");if(e)e.textContent=Math.max(0,Math.ceil((state.deadline-Date.now())/1000))}
function grade(s){return s>=18?1:s>=16?2:s>=14?3:s>=12?4:5}
function finishChallenge(){clearTimer();clearPending();state.screen="finish";render('<div class="card"><h1 class="title">VÝZVA SPLNĚNA</h1><div class="result"><b>'+esc(state.name)+'</b> • '+esc(state.clazz)+'<br><b>20 správných odpovědí za sebou — známka 1</b></div><div class="sendStatus" id="sendStatus"></div><div class="row"><a class="btn ghost" href="'+RESULTS_SHEET_URL+'" target="_blank" rel="noopener noreferrer" style="text-decoration:none">VÝSLEDKOVÁ TABULKA</a><button class="btn" data-act="home">HLAVNÍ MENU</button></div></div>');sendResult(1,"VÝZVA")}
function finish(){clearTimer();clearPending();state.screen="finish";const z=grade(state.score);render('<div class="card"><h1 class="title">VÝSLEDEK TESTU</h1><div class="result"><b>'+esc(state.name)+'</b> • '+esc(state.clazz)+'<br><b>Body:</b> '+state.score+'/'+TEST_COUNT+'<br><b>Známka:</b> '+z+'</div><div class="sendStatus" id="sendStatus"></div><div class="row"><a class="btn ghost" href="'+RESULTS_SHEET_URL+'" target="_blank" rel="noopener noreferrer" style="text-decoration:none">VÝSLEDKOVÁ TABULKA</a><button class="btn" data-act="home">HLAVNÍ MENU</button></div></div>');sendResult(z,"TEST")}
function buildPayload(z,kind){return{timestamp:new Date().toISOString(),jmeno:state.name,trida:state.clazz,znamka:z,rezim:state.mode,oddil:"druhy přísudku",body:state.score,celkem:TEST_COUNT,spravne:state.correct,spatne:state.wrongCount,poznamka:kind,sheetId:SHEET_ID,app:"Lovci druhů přísudku"}}
function renderCheatResult(){render('<div class="card"><h1 class="title">PODVOD</h1><div class="result"><b>Pokus byl ukončen.</b><br>Došlo k opuštění stránky nebo k návratu do hlavního menu během pokusu.<br><br><b>Známka:</b> 6</div><div class="row"><a class="btn ghost" href="'+RESULTS_SHEET_URL+'" target="_blank" rel="noopener noreferrer" style="text-decoration:none">VÝSLEDKOVÁ TABULKA</a><button class="btn" data-act="home">HLAVNÍ MENU</button></div></div>')}
function cheatFinish(reason){if(!activeProtected())return;state.cheated=true;state.locked=true;state.screen="finish";state.cheatSoundPending=document.visibilityState==="hidden";clearTimer();clearPending();try{sessionStorage.setItem(CHEAT_NOTICE_KEY,JSON.stringify({mode:state.mode,name:state.name,clazz:state.clazz,score:state.score,reason,timestamp:new Date().toISOString()}))}catch(e){}if(!state.cheatSoundPending)soundCheat();sendResult(6,"PODVOD: "+reason,true);renderCheatResult()}
function restoreCheatNotice(){let notice;try{notice=JSON.parse(sessionStorage.getItem(CHEAT_NOTICE_KEY)||"null")}catch(e){}if(!notice)return false;clearCheatNotice();state={...state,screen:"finish",mode:notice.mode==="challenge"?"challenge":"test",name:notice.name||"",clazz:notice.clazz||"",score:Number(notice.score)||0,cheated:true,finishSent:true,cheatSoundPending:false};renderCheatResult();return true}
function sendResult(z,kind,urgent=false){if(state.finishSent&&!urgent)return;state.finishSent=true;const payload=buildPayload(z,kind);try{localStorage.setItem("lovciDruhuPrisudku_lastResult",JSON.stringify(payload))}catch(e){}const params=new URLSearchParams();Object.entries(payload).forEach(([k,v])=>params.append(k,String(v??"")));const body=params.toString();const pending=()=>{try{localStorage.setItem("lovciDruhuPrisudku_pendingResult",JSON.stringify(payload))}catch(e){}const e=document.getElementById("sendStatus");if(e)e.textContent="Výsledek se nepodařilo odeslat. Poznamenej si body a známku."};try{let beaconQueued=false;if(urgent&&navigator.sendBeacon)beaconQueued=navigator.sendBeacon(GAS_WEB_APP_URL,new Blob([body],{type:"application/x-www-form-urlencoded;charset=UTF-8"}));if(!beaconQueued)fetch(GAS_WEB_APP_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"application/x-www-form-urlencoded;charset=UTF-8"},body,keepalive:true}).then(()=>{const e=document.getElementById("sendStatus");if(e)e.textContent="Výsledek byl odeslán. Zápis ověř ve výsledkové tabulce."}).catch(pending)}catch(e){pending()}}
let audioContext=null,cheatSoundQueued=false;
function getAudioContext(){try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return null;if(!audioContext||audioContext.state==="closed")audioContext=new A();return audioContext}catch(e){return null}}
function scheduleTone(c,freq,dur,gain,delay=0,type="sine"){const start=c.currentTime+Math.max(0,Number(delay)||0),peak=Math.max(.0001,Number(gain)||.08),o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(freq,start);g.gain.setValueAtTime(.0001,start);g.gain.exponentialRampToValueAtTime(peak,start+.02);g.gain.exponentialRampToValueAtTime(.0001,start+dur);o.connect(g);g.connect(c.destination);o.start(start);o.stop(start+dur+.02)}
function tone(freq,dur,gain=.08,delay=0,type="sine"){const c=getAudioContext();if(!c)return;const play=()=>{try{scheduleTone(c,freq,dur,gain,delay,type)}catch(e){}};if(c.state==="running")play();else c.resume().then(()=>{if(c.state==="running")play()}).catch(()=>{})}
function soundCorrect(){tone(760,.09,.08);tone(980,.11,.06,.08)}
function soundWrong(){tone(150,.18,.15)}
function playCheatSound(){tone(1450,1.0,.20,0,"sawtooth");tone(1180,1.0,.17,.48,"sawtooth");tone(1450,1.0,.20,1.0,"sawtooth")}
function soundCheat(){const c=getAudioContext();if(!c)return;if(c.state==="running"){playCheatSound();return}cheatSoundQueued=true;c.resume().then(()=>{if(cheatSoundQueued&&c.state==="running"){cheatSoundQueued=false;playCheatSound()}}).catch(()=>{})}
function unlockAudio(){const c=getAudioContext();if(!c||c.state==="running")return;c.resume().then(()=>{if(cheatSoundQueued&&c.state==="running"){cheatSoundQueued=false;playCheatSound()}}).catch(()=>{})}
document.addEventListener("pointerdown",unlockAudio,{passive:true});document.addEventListener("keydown",unlockAudio);
document.addEventListener("visibilitychange",()=>{if(document.hidden)cheatFinish("přepnutí mimo stránku");else if(state.cheatSoundPending){state.cheatSoundPending=false;soundCheat()}});
window.addEventListener("pagehide",()=>cheatFinish("opuštění stránky"));
const actions={home:home,training:()=>start("training"),nameChallenge:()=>nameScreen("challenge"),nameTest:()=>nameScreen("test"),next:advance};if(!restoreCheatNotice())home();
</script>
